
name: Build CHALLENGER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 5. Install icon generator
      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      # 6. Bundle native plugins
      - name: Bundle native plugins
        run: npm run build:native

      # 7. Prepare website files and logo
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp native-plugins.js www/native-plugins.js

          # Find custom logo
          if [ -f assets/icon.png ]; then
            echo "Logo found in assets folder"

          elif [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            echo "Root logo copied to assets"

          else
            echo "WARNING: Custom logo not found"
          fi

      # 8. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 9. Generate app icon
      - name: Generate app icon
        run: |
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android
          else
            echo "No custom icon found. Using default Android icon."
          fi

      # 10. Configure Google Login Deep Link
      - name: Configure Android Deep Link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:name=".MainActivity"' in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:launchMode="singleTask"',
                  1
              )

          intent = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="challengerapp" android:host="login-callback" />
                  </intent-filter>
          """

          if "challengerapp" not in s:
              s = s.replace(
                  "</activity>",
                  intent + "\\n            </activity>",
                  1
              )

          p.write_text(s)
          PY

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 12. Build APK
      - name: Build CHALLENGER APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 13. Upload APK
      - name: Upload CHALLENGER APK
        uses: actions/upload-artifact@v4
        with:
          name: CHALLENGER-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
