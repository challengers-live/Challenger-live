
name: Build CHALLENGER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CHALLENGER APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Install icon generator
      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      # 6. Bundle native plugins
      - name: Bundle native plugins
        run: npm run build:native

      # 7. Prepare website
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp native-plugins.js www/native-plugins.js

          if [ -f assets/icon.png ]; then
            echo "Custom icon found"
          elif [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            echo "Icon copied"
          else
            echo "No custom icon found"
          fi

      # 8. Add Android platform if missing
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      # 9. Generate app icon
      - name: Generate Android icon
        run: |
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android
          else
            echo "Using default Android icon"
          fi

      # 10. Configure Google Login Deep Link
      - name: Configure Android Deep Link
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          tree = ET.parse(manifest)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise Exception("Application tag not found")

          activity = None

          for item in application.findall("activity"):
              name = item.get(f"{{{ANDROID}}}name", "")

              if name.endswith("MainActivity"):
                  activity = item
                  break

          if activity is None:
              raise Exception("MainActivity not found")

          activity.set(
              f"{{{ANDROID}}}launchMode",
              "singleTask"
          )

          exists = False

          for intent in activity.findall("intent-filter"):
              for data in intent.findall("data"):
                  if (
                      data.get(f"{{{ANDROID}}}scheme") == "challengerapp"
                      and
                      data.get(f"{{{ANDROID}}}host") == "login-callback"
                  ):
                      exists = True

          if not exists:
              intent = ET.SubElement(
                  activity,
                  "intent-filter"
              )

              ET.SubElement(
                  intent,
                  "action",
                  {
                      f"{{{ANDROID}}}name":
                      "android.intent.action.VIEW"
                  }
              )

              ET.SubElement(
                  intent,
                  "category",
                  {
                      f"{{{ANDROID}}}name":
                      "android.intent.category.DEFAULT"
                  }
              )

              ET.SubElement(
                  intent,
                  "category",
                  {
                      f"{{{ANDROID}}}name":
                      "android.intent.category.BROWSABLE"
                  }
              )

              ET.SubElement(
                  intent,
                  "data",
                  {
                      f"{{{ANDROID}}}scheme": "challengerapp",
                      f"{{{ANDROID}}}host": "login-callback"
                  }
              )

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse(manifest)

          print("Deep Link configured successfully")
          PY

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 12. Build APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 13. Upload APK
      - name: Upload CHALLENGER APK
        uses: actions/upload-artifact@v4
        with:
          name: CHALLENGER-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
